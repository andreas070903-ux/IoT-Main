name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    # Ugentlig scanning, så nye sårbarheder i afhængigheder opdages
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- CI: test
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer afhængigheder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Kør tests
        run: python -m pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage-rapport
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ------------------------------------------------------- CI: sikkerhed (kode)
  security:
    name: Sikkerhedsscanning (kode og afhængigheder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer scanningsværktøjer
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit (statisk analyse af Python-kode)
        run: bandit -r . --exclude ./tests,./.venv -ll

      - name: pip-audit (kendte sårbarheder i afhængigheder)
        run: pip-audit -r requirements.txt

  # ------------------------------------------------------- CD: Docker-image
  docker:
    name: Byg, scan og publicér Docker-image
    needs: [test, security]
    # Springes over ved den ugentlige scanning
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log ind på GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generér tags og labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Byg først lokalt, så imaget kan scannes, før det pushes
      - name: Byg image (lokalt til scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Resultatet vises i loggen (kræver ikke GitHub Advanced Security)
      - name: Trivy-scanning af image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: scan-target:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Publicér kun ved push til main eller versions-tags, aldrig fra pull requests
      - name: Publicér image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
